name: Burn-Ex CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Burn-Ex to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend and Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            echo "=============================================="
            echo "          BURN-EX CI/CD DEPLOYMENT"
            echo "=============================================="

            PROJECT="/home/ubuntu/Burn-Ex"
            BACKEND="$PROJECT/backend"
            FRONTEND="$PROJECT/frontend"
            VENV="$PROJECT/.venv"

            BACKEND_PORT=5000
            FRONTEND_PORT=3000

            BACKEND_LOG="/home/ubuntu/burnex-backend.log"
            FRONTEND_LOG="/home/ubuntu/burnex-frontend.log"

            BACKEND_PID_FILE="/home/ubuntu/burnex-backend.pid"
            FRONTEND_PID_FILE="/home/ubuntu/burnex-frontend.pid"

            echo ""
            echo ">>> Checking project directories"

            test -d "$PROJECT" || {
              echo "ERROR: $PROJECT not found"
              exit 1
            }

            test -d "$BACKEND" || {
              echo "ERROR: Backend folder not found"
              exit 1
            }

            test -d "$FRONTEND" || {
              echo "ERROR: Frontend folder not found"
              exit 1
            }

            test -d "$VENV" || {
              echo "ERROR: Python virtual environment not found"
              exit 1
            }

            test -f "$BACKEND/api.py" || {
              echo "ERROR: backend/api.py not found"
              exit 1
            }

            test -f "$BACKEND/requirements.txt" || {
              echo "ERROR: backend/requirements.txt not found"
              exit 1
            }

            test -f "$FRONTEND/package.json" || {
              echo "ERROR: frontend/package.json not found"
              exit 1
            }

            cd "$PROJECT"

            echo ""
            echo "=============================================="
            echo "             UPDATING SOURCE CODE"
            echo "=============================================="

            git fetch origin main
            git reset --hard origin/main

            echo ""
            echo ">>> Current commit:"
            git rev-parse --short HEAD

            echo ""
            echo "=============================================="
            echo "              BACKEND DEPLOYMENT"
            echo "=============================================="

            cd "$BACKEND"

            echo ">>> Activating Python virtual environment"

            source "$VENV/bin/activate"

            echo ">>> Python version"
            python --version

            echo ">>> Installing backend dependencies"

            pip install --no-cache-dir -r requirements.txt

            echo ">>> Testing backend import"

            python -c "from api import app; print('Backend import OK')"

            echo ""
            echo ">>> Stopping old backend"

            if [ -f "$BACKEND_PID_FILE" ]; then
              OLD_BACKEND_PID=$(cat "$BACKEND_PID_FILE" 2>/dev/null || true)

              if [ -n "$OLD_BACKEND_PID" ]; then
                if kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then
                  echo "Stopping backend PID: $OLD_BACKEND_PID"
                  kill "$OLD_BACKEND_PID" || true
                  sleep 3

                  if kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then
                    kill -9 "$OLD_BACKEND_PID" || true
                  fi
                fi
              fi

              rm -f "$BACKEND_PID_FILE"
            fi

            echo ""
            echo ">>> Cleaning backend port $BACKEND_PORT"

            BACKEND_PORT_PIDS=$(lsof -ti:"$BACKEND_PORT" 2>/dev/null || true)

            if [ -n "$BACKEND_PORT_PIDS" ]; then
              for PID in $BACKEND_PORT_PIDS; do
                kill "$PID" || true
              done

              sleep 3
            fi

            echo ""
            echo ">>> Starting backend"

            nohup "$VENV/bin/uvicorn" api:app \
              --host 0.0.0.0 \
              --port "$BACKEND_PORT" \
              > "$BACKEND_LOG" 2>&1 &

            BACKEND_PID=$!

            echo "$BACKEND_PID" > "$BACKEND_PID_FILE"

            echo "Backend PID: $BACKEND_PID"

            echo ""
            echo ">>> Waiting for backend"

            BACKEND_READY=false

            for i in {1..20}; do
              if curl -fsS \
                "http://127.0.0.1:$BACKEND_PORT/" \
                > /dev/null 2>&1; then

                BACKEND_READY=true
                echo "Backend is ready"
                break
              fi

              echo "Backend starting... $i/20"
              sleep 2
            done

            if [ "$BACKEND_READY" != "true" ]; then
              echo ""
              echo "=============================================="
              echo "              BACKEND FAILED"
              echo "=============================================="

              cat "$BACKEND_LOG" || true

              exit 1
            fi

            echo ""
            echo "=============================================="
            echo "             FRONTEND DEPLOYMENT"
            echo "=============================================="

            cd "$FRONTEND"

            echo ">>> Checking Node.js"

            command -v node >/dev/null 2>&1 || {
              echo "ERROR: Node.js is not installed"
              exit 1
            }

            node --version

            echo ">>> Checking npm"

            command -v npm >/dev/null 2>&1 || {
              echo "ERROR: npm is not installed"
              exit 1
            }

            npm --version

            echo ""
            echo ">>> Installing frontend dependencies"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            echo ""
            echo ">>> Building frontend"

            npm run build

            echo ""
            echo ">>> Checking frontend build"

            test -d "$FRONTEND/dist" || {
              echo "ERROR: dist folder was not created"
              exit 1
            }

            test -f "$FRONTEND/dist/index.html" || {
              echo "ERROR: dist/index.html was not created"
              exit 1
            }

            echo "Frontend build successful"

            echo ""
            echo ">>> Stopping old frontend"

            if [ -f "$FRONTEND_PID_FILE" ]; then
              OLD_FRONTEND_PID=$(cat "$FRONTEND_PID_FILE" 2>/dev/null || true)

              if [ -n "$OLD_FRONTEND_PID" ]; then
                if kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then
                  echo "Stopping frontend PID: $OLD_FRONTEND_PID"
                  kill "$OLD_FRONTEND_PID" || true
                  sleep 3

                  if kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then
                    kill -9 "$OLD_FRONTEND_PID" || true
                  fi
                fi
              fi

              rm -f "$FRONTEND_PID_FILE"
            fi

            echo ""
            echo ">>> Cleaning frontend port $FRONTEND_PORT"

            FRONTEND_PORT_PIDS=$(lsof -ti:"$FRONTEND_PORT" 2>/dev/null || true)

            if [ -n "$FRONTEND_PORT_PIDS" ]; then
              for PID in $FRONTEND_PORT_PIDS; do
                kill "$PID" || true
              done

              sleep 3
            fi

            echo ""
            echo ">>> Starting frontend"

            nohup npx --yes serve \
              -s "$FRONTEND/dist" \
              -l "$FRONTEND_PORT" \
              > "$FRONTEND_LOG" 2>&1 &

            FRONTEND_PID=$!

            echo "$FRONTEND_PID" > "$FRONTEND_PID_FILE"

            echo "Frontend PID: $FRONTEND_PID"

            echo ""
            echo ">>> Waiting for frontend"

            FRONTEND_READY=false

            for i in {1..20}; do
              if curl -fsS \
                "http://127.0.0.1:$FRONTEND_PORT/" \
                > /dev/null 2>&1; then

                FRONTEND_READY=true
                echo "Frontend is ready"
                break
              fi

              echo "Frontend starting... $i/20"
              sleep 2
            done

            if [ "$FRONTEND_READY" != "true" ]; then
              echo ""
              echo "=============================================="
              echo "              FRONTEND FAILED"
              echo "=============================================="

              cat "$FRONTEND_LOG" || true

              exit 1
            fi

            echo ""
            echo "=============================================="
            echo "             FINAL HEALTH CHECK"
            echo "=============================================="

            echo ">>> Backend health check"

            curl -fsS \
              "http://127.0.0.1:$BACKEND_PORT/" \
              > /dev/null

            echo "Backend: OK"

            echo ""
            echo ">>> Frontend health check"

            curl -fsS \
              "http://127.0.0.1:$FRONTEND_PORT/" \
              > /dev/null

            echo "Frontend: OK"

            echo ""
            echo "=============================================="
            echo "          DEPLOYMENT SUCCESSFUL"
            echo "=============================================="

            echo ""
            echo "Backend:"
            echo "http://127.0.0.1:$BACKEND_PORT"

            echo ""
            echo "Frontend:"
            echo "http://127.0.0.1:$FRONTEND_PORT"

            echo ""
            echo "Backend log:"
            echo "$BACKEND_LOG"

            echo ""
            echo "Frontend log:"
            echo "$FRONTEND_LOG"

            echo ""
            echo "=============================================="
            echo "          BURN-EX DEPLOYMENT DONE"
            echo "=============================================="
