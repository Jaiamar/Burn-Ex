yaml
name: Burn-Ex CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Burn-Ex to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend and Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            echo "=============================================="
            echo "          BURN-EX CI/CD DEPLOYMENT"
            echo "=============================================="

            PROJECT="/home/ubuntu/Burn-Ex"
            BACKEND="$PROJECT/backend"
            FRONTEND="$PROJECT/frontend"
            VENV="$PROJECT/.venv"

            BACKEND_PORT=5000
            FRONTEND_PORT=3000

            BACKEND_PID_FILE="/home/ubuntu/burnex-backend.pid"
            FRONTEND_PID_FILE="/home/ubuntu/burnex-frontend.pid"

            BACKEND_LOG="/home/ubuntu/burnex-backend.log"
            FRONTEND_LOG="/home/ubuntu/burnex-frontend.log"

            # ==================================================
            # CHECK PROJECT
            # ==================================================

            echo ""
            echo ">>> Checking project"

            if [ ! -d "$PROJECT" ]; then
              echo "ERROR: Project directory not found:"
              echo "$PROJECT"
              exit 1
            fi

            if [ ! -d "$BACKEND" ]; then
              echo "ERROR: Backend directory not found:"
              echo "$BACKEND"
              exit 1
            fi

            if [ ! -d "$FRONTEND" ]; then
              echo "ERROR: Frontend directory not found:"
              echo "$FRONTEND"
              exit 1
            fi

            cd "$PROJECT"

            # ==================================================
            # UPDATE CODE
            # ==================================================

            echo ""
            echo ">>> Updating source code"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo ""
            echo ">>> Current commit:"
            git rev-parse --short HEAD

            # ==================================================
            # CHECK PYTHON ENVIRONMENT
            # ==================================================

            echo ""
            echo "=============================================="
            echo "              BACKEND DEPLOYMENT"
            echo "=============================================="

            if [ ! -d "$VENV" ]; then
              echo "ERROR: Virtual environment not found:"
              echo "$VENV"
              exit 1
            fi

            if [ ! -f "$BACKEND/api.py" ]; then
              echo "ERROR: backend/api.py not found"
              exit 1
            fi

            echo ">>> Activating Python virtual environment"

            source "$VENV/bin/activate"

            echo ">>> Python:"
            python --version

            echo ">>> Pip:"
            pip --version

            # ==================================================
            # BACKEND DEPENDENCIES
            # ==================================================

            echo ""
            echo ">>> Installing backend dependencies"

            cd "$BACKEND"

            pip install --no-cache-dir -r requirements.txt

            # ==================================================
            # BACKEND STARTUP TEST
            # ==================================================

            echo ""
            echo ">>> Testing backend configuration"

            "$VENV/bin/python" -c "from api import app; print('Backend import OK')"

            # ==================================================
            # STOP OLD BACKEND
            # ==================================================

            echo ""
            echo ">>> Stopping previous backend"

            if [ -f "$BACKEND_PID_FILE" ]; then
              OLD_BACKEND_PID=$(cat "$BACKEND_PID_FILE" || true)

              if [ -n "$OLD_BACKEND_PID" ] && kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then
                echo "Stopping backend PID: $OLD_BACKEND_PID"
                kill "$OLD_BACKEND_PID" || true

                sleep 3

                if kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then
                  echo "Force stopping backend PID: $OLD_BACKEND_PID"
                  kill -9 "$OLD_BACKEND_PID" || true
                fi
              fi

              rm -f "$BACKEND_PID_FILE"
            fi

            # ==================================================
            # CLEAN PORT 5000
            # ==================================================

            echo ""
            echo ">>> Checking backend port"

            BACKEND_PIDS=$(lsof -ti :"$BACKEND_PORT" 2>/dev/null || true)

            if [ -n "$BACKEND_PIDS" ]; then
              echo "Cleaning processes using port $BACKEND_PORT"

              for PID in $BACKEND_PIDS; do
                kill "$PID" || true
              done

              sleep 2
            fi

            # ==================================================
            # START BACKEND
            # ==================================================

            echo ""
            echo ">>> Starting backend"

            nohup "$VENV/bin/uvicorn" api:app \
              --host 0.0.0.0 \
              --port "$BACKEND_PORT" \
              > "$BACKEND_LOG" 2>&1 &

            BACKEND_PID=$!

            echo "$BACKEND_PID" > "$BACKEND_PID_FILE"

            echo "Backend PID: $BACKEND_PID"

            # ==================================================
            # BACKEND HEALTH CHECK
            # ==================================================

            echo ""
            echo ">>> Waiting for backend"

            BACKEND_READY=false

            for i in {1..15}; do
              if curl -fsS "http://127.0.0.1:$BACKEND_PORT/" > /dev/null 2>&1; then
                BACKEND_READY=true
                break
              fi

              echo "Backend not ready yet... attempt $i/15"
              sleep 2
            done

            if [ "$BACKEND_READY" != "true" ]; then
              echo ""
              echo "ERROR: Backend failed health check"
              echo "=============================================="
              echo "BACKEND LOG"
              echo "=============================================="
              cat "$BACKEND_LOG" || true
              exit 1
            fi

            echo ">>> Backend is healthy"

            # ==================================================
            # FRONTEND DEPLOYMENT
            # ==================================================

            echo ""
            echo "=============================================="
            echo "             FRONTEND DEPLOYMENT"
            echo "=============================================="

            cd "$FRONTEND"

            if [ ! -f package.json ]; then
              echo "ERROR: frontend/package.json not found"
              exit 1
            fi

            echo ">>> Node version"

            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: Node.js is not installed on EC2"
              echo "Install Node.js before running this deployment."
              exit 1
            fi

            node --version

            echo ">>> npm version"
            npm --version

            # ==================================================
            # INSTALL FRONTEND DEPENDENCIES
            # ==================================================

            echo ""
            echo ">>> Installing frontend dependencies"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # ==================================================
            # BUILD FRONTEND
            # ==================================================

            echo ""
            echo ">>> Building frontend"

            npm run build

            # ==================================================
            # CHECK BUILD
            # ==================================================

            echo ""
            echo ">>> Checking frontend build"

            if [ ! -d "$FRONTEND/dist" ]; then
              echo "ERROR: dist directory was not created"
              exit 1
            fi

            if [ ! -f "$FRONTEND/dist/index.html" ]; then
              echo "ERROR: dist/index.html was not created"
              exit 1
            fi

            echo "Frontend build successful"

            # ==================================================
            # STOP OLD FRONTEND
            # ==================================================

            echo ""
            echo ">>> Stopping previous frontend"

            if [ -f "$FRONTEND_PID_FILE" ]; then
              OLD_FRONTEND_PID=$(cat "$FRONTEND_PID_FILE" || true)

              if [ -n "$OLD_FRONTEND_PID" ] && kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then
                echo "Stopping frontend PID: $OLD_FRONTEND_PID"
                kill "$OLD_FRONTEND_PID" || true

                sleep 3

                if kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then
                  echo "Force stopping frontend PID: $OLD_FRONTEND_PID"
                  kill -9 "$OLD_FRONTEND_PID" || true
                fi
              fi

              rm -f "$FRONTEND_PID_FILE"
            fi

            # ==================================================
            # CLEAN PORT 3000
            # ==================================================

            echo ""
            echo ">>> Checking frontend port"

            FRONTEND_PIDS=$(lsof -ti :"$FRONTEND_PORT" 2>/dev/null || true)

            if [ -n "$FRONTEND_PIDS" ]; then
              echo "Cleaning processes using port $FRONTEND_PORT"

              for PID in $FRONTEND_PIDS; do
                kill "$PID" || true
              done

              sleep 2
            fi

            # ==================================================
            # START FRONTEND
            # ==================================================

            echo ""
            echo ">>> Starting frontend"

            nohup npx --yes serve \
              -s "$FRONTEND/dist" \
              -l "$FRONTEND_PORT" \
              > "$FRONTEND_LOG" 2>&1 &

            FRONTEND_PID=$!

            echo "$FRONTEND_PID" > "$FRONTEND_PID_FILE"

            echo "Frontend PID: $FRONTEND_PID"

            # ==================================================
            # FRONTEND HEALTH CHECK
            # ==================================================

            echo ""
            echo ">>> Waiting for frontend"

            FRONTEND_READY=false

            for i in {1..15}; do
              if curl -fsS "http://127.0.0.1:$FRONTEND_PORT/" > /dev/null 2>&1; then
                FRONTEND_READY=true
                break
              fi

              echo "Frontend not ready yet... attempt $i/15"
              sleep 2
            done

            if [ "$FRONTEND_READY" != "true" ]; then
              echo ""
              echo "ERROR: Frontend failed health check"
              echo "=============================================="
              echo "FRONTEND LOG"
              echo "=============================================="
              cat "$FRONTEND_LOG" || true
              exit 1
            fi

            echo ">>> Frontend is healthy"

            # ==================================================
            # FINAL CHECK
            # ==================================================

            echo ""
            echo "=============================================="
            echo "              DEPLOYMENT SUCCESSFUL"
            echo "=============================================="

            echo ""
            echo "Backend:"
            echo "http://127.0.0.1:$BACKEND_PORT"

            echo ""
            echo "Frontend:"
            echo "http://127.0.0.1:$FRONTEND_PORT"

            echo ""
            echo "Backend PID:"
            cat "$BACKEND_PID_FILE"

            echo ""
            echo "Frontend PID:"
            cat "$FRONTEND_PID_FILE"

            echo ""
            echo ">>> Deployment completed successfully"

