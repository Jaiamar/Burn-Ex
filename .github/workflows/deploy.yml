name: Burn-Ex CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Burn-Ex to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            echo "======================================"
            echo "      Burn-Ex CI/CD Deployment"
            echo "======================================"

            cd /home/ubuntu/Burn-Ex

            echo ">>> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            ########################################
            # Backend Deployment
            ########################################

            echo ">>> Activating Python Virtual Environment"
            source /home/ubuntu/Burn-Ex/.venv/bin/activate

            echo ">>> Installing Backend Dependencies"
            cd /home/ubuntu/Burn-Ex/backend
            pip install --no-cache-dir -r requirements.txt

            echo ">>> Stopping Old Backend"

            pkill -f "uvicorn" || true
            sleep 3

            echo ">>> Starting Backend"

            nohup /home/ubuntu/Burn-Ex/.venv/bin/uvicorn api:app \
              --host 0.0.0.0 \
              --port 5000 \
              > /home/ubuntu/burnex-backend.log 2>&1 &

            ########################################
            # Frontend Deployment
            ########################################

            echo ">>> Deploying Frontend"

            cd /home/ubuntu/Burn-Ex/frontend

            npm install

            echo ">>> Building React/Vite App"
            npm run build

            echo ">>> Restarting Frontend"

            pkill -f "vite" || true
            pkill -f "serve -s dist" || true

            nohup npx serve -s dist -l 3000 \
              > /home/ubuntu/burnex-frontend.log 2>&1 &

            ########################################
            # Health Checks
            ########################################

            sleep 10

            echo ">>> Checking Backend"

            if curl -f http://127.0.0.1:5000/; then
              echo "Backend OK"
            else
              echo "Backend Failed"
              cat /home/ubuntu/burnex-backend.log
              exit 1
            fi

            echo ">>> Checking Frontend"

            if curl -f http://127.0.0.1:3000/; then
              echo "Frontend OK"
            else
              echo "Frontend Failed"
              cat /home/ubuntu/burnex-frontend.log
              exit 1
            fi

            echo ""
            echo "======================================"
            echo "      DEPLOYMENT SUCCESSFUL"
            echo "======================================"
