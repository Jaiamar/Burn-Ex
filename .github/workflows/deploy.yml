```yaml
name: Burn-Ex CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Burn-Ex to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend + Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 40m

          script: |
            set -Eeuo pipefail

            echo "=================================================="
            echo "          BURN-EX CI/CD DEPLOYMENT"
            echo "=================================================="

            PROJECT="/home/ubuntu/Burn-Ex"
            BACKEND="$PROJECT/backend"
            FRONTEND="$PROJECT/frontend"
            VENV="$PROJECT/.venv"

            BACKEND_PORT=5000
            FRONTEND_PORT=3000

            BACKEND_LOG="/home/ubuntu/burnex-backend.log"
            FRONTEND_LOG="/home/ubuntu/burnex-frontend.log"

            BACKEND_PID_FILE="/home/ubuntu/burnex-backend.pid"
            FRONTEND_PID_FILE="/home/ubuntu/burnex-frontend.pid"

            # ==================================================
            # SYSTEM CHECK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "                 SYSTEM CHECK"
            echo "=================================================="

            echo ">>> Memory"
            free -h

            echo ""
            echo ">>> Disk"
            df -h /

            echo ""
            echo ">>> Swap"
            swapon --show || true

            # ==================================================
            # CREATE SWAP IF NEEDED
            # ==================================================

            echo ""
            echo "=================================================="
            echo "              CHECKING SWAP MEMORY"
            echo "=================================================="

            SWAP_COUNT=$(swapon --show --noheadings 2>/dev/null | wc -l)

            if [ "$SWAP_COUNT" -eq 0 ]; then

              echo ">>> No swap detected"
              echo ">>> Creating 2GB swap file"

              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile
              fi

              sudo chmod 600 /swapfile

              if ! sudo swapon --show | grep -q "/swapfile"; then
                sudo mkswap /swapfile
                sudo swapon /swapfile
              fi

              if ! grep -q "^/swapfile " /etc/fstab; then
                echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab > /dev/null
              fi

              echo ">>> Swap created successfully"

            else

              echo ">>> Swap already exists"

            fi

            echo ""
            echo ">>> Current memory after swap setup"
            free -h

            echo ""
            echo ">>> Current swap"
            swapon --show || true

            # ==================================================
            # CHECK PROJECT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "               PROJECT CHECK"
            echo "=================================================="

            test -d "$PROJECT" || {
              echo "ERROR: Project directory not found:"
              echo "$PROJECT"
              exit 1
            }

            test -d "$BACKEND" || {
              echo "ERROR: Backend directory not found:"
              echo "$BACKEND"
              exit 1
            }

            test -d "$FRONTEND" || {
              echo "ERROR: Frontend directory not found:"
              echo "$FRONTEND"
              exit 1
            }

            test -d "$VENV" || {
              echo "ERROR: Python virtual environment not found:"
              echo "$VENV"
              exit 1
            }

            test -f "$BACKEND/api.py" || {
              echo "ERROR: backend/api.py not found"
              exit 1
            }

            test -f "$BACKEND/requirements.txt" || {
              echo "ERROR: backend/requirements.txt not found"
              exit 1
            }

            test -f "$FRONTEND/package.json" || {
              echo "ERROR: frontend/package.json not found"
              exit 1
            }

            # ==================================================
            # UPDATE CODE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "               UPDATING SOURCE CODE"
            echo "=================================================="

            cd "$PROJECT"

            git fetch origin main

            git reset --hard origin/main

            echo ""
            echo ">>> Current commit:"
            git rev-parse --short HEAD

            # ==================================================
            # BACKEND
            # ==================================================

            echo ""
            echo "=================================================="
            echo "              BACKEND DEPLOYMENT"
            echo "=================================================="

            cd "$BACKEND"

            echo ">>> Activating virtual environment"

            source "$VENV/bin/activate"

            echo ""
            echo ">>> Python version"
            python --version

            echo ""
            echo ">>> Installing backend dependencies"

            pip install --no-cache-dir -r requirements.txt

            echo ""
            echo ">>> Testing backend import"

            python -c "from api import app; print('Backend import OK')"

            # ==================================================
            # STOP OLD BACKEND
            # ==================================================

            echo ""
            echo ">>> Stopping old backend"

            if [ -f "$BACKEND_PID_FILE" ]; then

              OLD_BACKEND_PID=$(cat "$BACKEND_PID_FILE" 2>/dev/null || true)

              if [ -n "$OLD_BACKEND_PID" ]; then

                if kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then

                  echo "Stopping backend PID: $OLD_BACKEND_PID"

                  kill "$OLD_BACKEND_PID" || true

                  sleep 3

                  if kill -0 "$OLD_BACKEND_PID" 2>/dev/null; then
                    echo "Force stopping backend"
                    kill -9 "$OLD_BACKEND_PID" || true
                  fi

                fi

              fi

              rm -f "$BACKEND_PID_FILE"

            fi

            # ==================================================
            # CLEAN BACKEND PORT
            # ==================================================

            echo ""
            echo ">>> Cleaning port $BACKEND_PORT"

            BACKEND_PIDS=$(lsof -ti:"$BACKEND_PORT" 2>/dev/null || true)

            if [ -n "$BACKEND_PIDS" ]; then

              for PID in $BACKEND_PIDS; do
                kill "$PID" || true
              done

              sleep 3

            fi

            # ==================================================
            # START BACKEND
            # ==================================================

            echo ""
            echo ">>> Starting backend"

            nohup "$VENV/bin/uvicorn" api:app \
              --host 0.0.0.0 \
              --port "$BACKEND_PORT" \
              > "$BACKEND_LOG" 2>&1 &

            BACKEND_PID=$!

            echo "$BACKEND_PID" > "$BACKEND_PID_FILE"

            echo "Backend PID: $BACKEND_PID"

            # ==================================================
            # BACKEND HEALTH CHECK
            # ==================================================

            echo ""
            echo ">>> Waiting for backend"

            BACKEND_READY=false

            for i in {1..20}; do

              if curl -fsS \
                "http://127.0.0.1:$BACKEND_PORT/" \
                > /dev/null 2>&1; then

                BACKEND_READY=true

                echo "Backend is ready"

                break

              fi

              echo "Backend starting... $i/20"

              sleep 2

            done

            if [ "$BACKEND_READY" != "true" ]; then

              echo ""
              echo "=================================================="
              echo "              BACKEND FAILED"
              echo "=================================================="

              cat "$BACKEND_LOG" || true

              exit 1

            fi

            # ==================================================
            # FRONTEND
            # ==================================================

            echo ""
            echo "=================================================="
            echo "             FRONTEND DEPLOYMENT"
            echo "=================================================="

            cd "$FRONTEND"

            echo ">>> Checking Node.js"

            command -v node >/dev/null 2>&1 || {
              echo "ERROR: Node.js is not installed"
              exit 1
            }

            node --version

            echo ""
            echo ">>> Checking npm"

            command -v npm >/dev/null 2>&1 || {
              echo "ERROR: npm is not installed"
              exit 1
            }

            npm --version

            # ==================================================
            # NODE MEMORY LIMIT
            # ==================================================

            echo ""
            echo ">>> Setting Node.js memory limit"

            export NODE_OPTIONS="--max-old-space-size=1536"

            echo "NODE_OPTIONS=$NODE_OPTIONS"

            # ==================================================
            # CLEAN NPM CACHE
            # ==================================================

            echo ""
            echo ">>> Cleaning npm cache"

            npm cache verify || true

            # ==================================================
            # INSTALL FRONTEND DEPENDENCIES
            # ==================================================

            echo ""
            echo "=================================================="
            echo "         INSTALLING FRONTEND DEPENDENCIES"
            echo "=================================================="

            if [ -f package-lock.json ]; then

              echo ">>> package-lock.json found"

              echo ">>> Running memory-safe npm ci"

              npm ci \
                --no-audit \
                --no-fund \
                --prefer-offline \
                --progress=false

            else

              echo ">>> package-lock.json not found"

              echo ">>> Running npm install"

              npm install \
                --no-audit \
                --no-fund \
                --prefer-offline \
                --progress=false

            fi

            echo ""
            echo ">>> Frontend dependencies installed successfully"

            # ==================================================
            # FRONTEND BUILD
            # ==================================================

            echo ""
            echo "=================================================="
            echo "              BUILDING FRONTEND"
            echo "=================================================="

            npm run build

            # ==================================================
            # CHECK BUILD
            # ==================================================

            echo ""
            echo ">>> Checking frontend build"

            test -d "$FRONTEND/dist" || {
              echo "ERROR: dist folder was not created"
              exit 1
            }

            test -f "$FRONTEND/dist/index.html" || {
              echo "ERROR: dist/index.html was not created"
              exit 1
            }

            echo ">>> Frontend build successful"

            # ==================================================
            # STOP OLD FRONTEND
            # ==================================================

            echo ""
            echo ">>> Stopping old frontend"

            if [ -f "$FRONTEND_PID_FILE" ]; then

              OLD_FRONTEND_PID=$(cat "$FRONTEND_PID_FILE" 2>/dev/null || true)

              if [ -n "$OLD_FRONTEND_PID" ]; then

                if kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then

                  echo "Stopping frontend PID: $OLD_FRONTEND_PID"

                  kill "$OLD_FRONTEND_PID" || true

                  sleep 3

                  if kill -0 "$OLD_FRONTEND_PID" 2>/dev/null; then
                    echo "Force stopping frontend"
                    kill -9 "$OLD_FRONTEND_PID" || true
                  fi

                fi

              fi

              rm -f "$FRONTEND_PID_FILE"

            fi

            # ==================================================
            # CLEAN FRONTEND PORT
            # ==================================================

            echo ""
            echo ">>> Cleaning port $FRONTEND_PORT"

            FRONTEND_PIDS=$(lsof -ti:"$FRONTEND_PORT" 2>/dev/null || true)

            if [ -n "$FRONTEND_PIDS" ]; then

              for PID in $FRONTEND_PIDS; do
                kill "$PID" || true
              done

              sleep 3

            fi

            # ==================================================
            # START FRONTEND
            # ==================================================

            echo ""
            echo ">>> Starting frontend"

            nohup npx --yes serve \
              -s "$FRONTEND/dist" \
              -l "$FRONTEND_PORT" \
              > "$FRONTEND_LOG" 2>&1 &

            FRONTEND_PID=$!

            echo "$FRONTEND_PID" > "$FRONTEND_PID_FILE"

            echo "Frontend PID: $FRONTEND_PID"

            # ==================================================
            # FRONTEND HEALTH CHECK
            # ==================================================

            echo ""
            echo ">>> Waiting for frontend"

            FRONTEND_READY=false

            for i in {1..20}; do

              if curl -fsS \
                "http://127.0.0.1:$FRONTEND_PORT/" \
                > /dev/null 2>&1; then

                FRONTEND_READY=true

                echo "Frontend is ready"

                break

              fi

              echo "Frontend starting... $i/20"

              sleep 2

            done

            if [ "$FRONTEND_READY" != "true" ]; then

              echo ""
              echo "=================================================="
              echo "             FRONTEND FAILED"
              echo "=================================================="

              cat "$FRONTEND_LOG" || true

              exit 1

            fi

            # ==================================================
            # FINAL HEALTH CHECK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "              FINAL HEALTH CHECK"
            echo "=================================================="

            echo ">>> Backend"

            curl -fsS \
              "http://127.0.0.1:$BACKEND_PORT/" \
              > /dev/null

            echo "Backend: OK"

            echo ""
            echo ">>> Frontend"

            curl -fsS \
              "http://127.0.0.1:$FRONTEND_PORT/" \
              > /dev/null

            echo "Frontend: OK"

            # ==================================================
            # FINAL MEMORY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "             FINAL SYSTEM STATUS"
            echo "=================================================="

            free -h

            echo ""
            echo ">>> Backend PID:"
            cat "$BACKEND_PID_FILE"

            echo ""
            echo ">>> Frontend PID:"
            cat "$FRONTEND_PID_FILE"

            echo ""
            echo "=================================================="
            echo "        BURN-EX DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo ""
            echo "Backend:"
            echo "http://127.0.0.1:$BACKEND_PORT"

            echo ""
            echo "Frontend:"
            echo "http://127.0.0.1:$FRONTEND_PORT"

            echo ""
            echo "Deployment completed successfully."
```
